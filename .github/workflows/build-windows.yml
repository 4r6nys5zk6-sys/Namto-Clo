name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:          # permite lanzarlo manualmente

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NamToClo.exe dist/NamToClo.exe
          if (Test-Path nam_input_wav.wav) {
            Copy-Item nam_input_wav.wav dist/
          }
          Copy-Item README.md, LICENSE, THIRD_PARTY.md dist/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamToClo-Windows-x64
          path: dist
          retention-days: 14
